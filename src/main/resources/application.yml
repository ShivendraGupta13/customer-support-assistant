server:
  port: 8000

adk:
  agents:
    loader: spring
    source-dir: target

observability:
  endpoint: http://localhost:3000/api/public/otel
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}

llm:
  provider: ollama # ollama | gemini | anthropic | openrouter
  ollama:
    base-url: http://localhost:11434/v1/
    model: qwen2.5:7b
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.0-flash
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-3-7-sonnet-20250219
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: https://openrouter.ai/api/v1/
    model: openrouter/auto

embedding:
  base-url: http://localhost:11434
  model: nomic-embed-text
  dimension: 768

qdrant:
  host: localhost
  port: 6334
  tls: false

spring:
  datasource:
    url: jdbc:h2:file:./data/support-assistant
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      # Hibernate create-drop owns DDL; schema.sql stays the documented contract.
      schema-locations: optional:classpath:do-not-run-schema.sql
      data-locations: classpath:data.sql
